plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'

    implementation group: 'org.joml', name: 'joml', version: '1.10.4'
    implementation group: 'org.lwjgl', name: 'lwjgl', version: '3.3.0'
    implementation group: 'org.lwjgl', name: 'lwjgl-glfw', version: '3.3.0'
    implementation group: 'org.lwjgl', name: 'lwjgl-opengl', version: '3.3.0'
    implementation group: 'org.lwjgl', name: 'lwjgl-stb', version: '3.3.0'

    // Platform-specific natives for cross-platform support
    // Detect platform at runtime
    String os = System.getProperty("os.name").toLowerCase()
    String arch = System.getProperty("os.arch").toLowerCase()
    String lwjglNatives
    
    if (os.contains("win")) {
        lwjglNatives = arch.contains("64") ? "natives-windows" : "natives-windows-x86"
    } else if (os.contains("mac")) {
        lwjglNatives = arch.startsWith("aarch64") || arch.startsWith("arm") ? "natives-macos-arm64" : "natives-macos"
    } else if (os.contains("nix") || os.contains("nux") || os.contains("aix")) {
        lwjglNatives = arch.contains("64") ? "natives-linux" : "natives-linux-x86"
    } else {
        throw new GradleException("Unsupported platform: " + os)
    }
    
    runtimeOnly group: 'org.lwjgl', name: 'lwjgl', version: '3.3.0', classifier: lwjglNatives
    runtimeOnly group: 'org.lwjgl', name: 'lwjgl-opengl', version: '3.3.0', classifier: lwjglNatives
    runtimeOnly group: 'org.lwjgl', name: 'lwjgl-glfw', version: '3.3.0', classifier: lwjglNatives
    runtimeOnly group: 'org.lwjgl', name: 'lwjgl-stb', version: '3.3.0', classifier: lwjglNatives
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java", "src/main/resources"]
        }
    }
}